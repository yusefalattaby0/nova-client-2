name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: |
          f=$(find . -name build.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "No build.gradle found anywhere in the repo. Upload the project files."
            ls -R | head -50
            exit 1
          fi
          echo "PROJECT=$(dirname "$f")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build
        working-directory: ${{ env.PROJECT }}
      - uses: actions/upload-artifact@v4
        with:
          name: nova-client
          path: |
            ${{ env.PROJECT }}/build/libs/*.jar
            !${{ env.PROJECT }}/build/libs/*-sources.jar
